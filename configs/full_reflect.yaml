# L3 feedback plus a short diagnosis before each patch (§8.4).
feedback: L3
max_attempts: 3
reflect: true
explain_failures: false
model:
  name: openai/gpt-oss-20b
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  temperature: 0.0
  max_output_tokens: 4096  # a reasoning model: room for its thinking plus the file
  reasoning_effort: low    # medium spent the whole budget thinking on ~10% of attempts
