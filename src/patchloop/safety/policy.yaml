# The static policy check (§7.1), applied on the host with `ast` before any candidate runs.
# Defense in depth, not the boundary: building names from strings gets past it, and the sandbox
# holds anyway. Its job is early, actionable feedback and a count of attempted violations.
#
# A dotted name matches itself and everything under it (`os.spawn*` style globs are allowed),
# and is resolved through import aliases (`import os as o; o.system`, `from os import system`).
# Plain `import os` stays allowed so `os.path` keeps working.

block:
  # Importing the module, or anything from it.
  modules:
    network: [socket, ssl, urllib, http, requests, httpx, aiohttp, ftplib, smtplib, poplib,
              imaplib, telnetlib, xmlrpc, socketserver, asyncio, selectors, select]
    process control: [subprocess, multiprocessing, concurrent, pty, signal]
    native access: [ctypes, cffi, mmap]
    dynamic code: [importlib, runpy, code, codeop, pickle, marshal]
    file writes: [shutil, tempfile]
    result tampering: [atexit, pytest, _pytest, unittest, faulthandler]
  # Using the name: calling it, reading it, or importing it.
  names:
    process control: [os.system, os.popen, os.fork, os.forkpty, "os.spawn*", "os.exec*",
                      "os.posix_spawn*", os.kill, os.killpg]
    dynamic code: [eval, exec, compile, __import__]
    file writes: [os.remove, os.unlink, os.rmdir, os.removedirs, os.rename, os.renames,
                  os.replace, os.mkdir, os.makedirs, os.chmod, os.chown, os.truncate,
                  os.symlink, os.link, os.open, os.write, os.fdopen]
    secrets: [os.environ, os.environb, os.getenv, os.getenvb, os.putenv, os.unsetenv]
    result tampering: [sys.exit, os._exit, os.abort, exit, quit]
  # Method calls on any object (pathlib and file-like writes).
  methods:
    file writes: [write_text, write_bytes, unlink, rmdir, touch, mkdir, symlink_to,
                  hardlink_to]
  # open(), io.open() or Path.open() with a literal mode containing any of these characters.
  write_modes: "wax+"

flag:
  modules:
    introspection: [builtins, inspect, gc]
  names:
    introspection: [__builtins__, __subclasses__, __globals__, __code__, globals, sys.modules,
                    sys.settrace, sys.setprofile]
